<body class="bg-surface font-body-lg text-on-surface antialiased min-h-screen pb-[160px]" data-mode="connect">
<!-- TopAppBar -->
<header class="h-[64px] w-full top-0 sticky bg-surface shadow-sm z-40 flex items-center justify-between px-margin-mobile">
<button aria-label="Voltar" class="w-12 h-12 flex items-center justify-center text-primary active:scale-95 duration-200 hover:bg-primary-container/20 transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-primary tracking-tight">Bella Flora Fisio</h1>
<button aria-label="Opções" class="w-12 h-12 flex items-center justify-center text-primary active:scale-95 duration-200 hover:bg-primary-container/20 transition-colors rounded-full">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="max-w-3xl mx-auto pt-stack-md px-margin-mobile">
<!-- Header Section -->
<div class="mb-stack-lg">
<div class="flex items-center gap-2 mb-stack-sm text-secondary">
<span class="material-symbols-outlined text-sm" data-icon="edit_note">edit_note</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Editando Plano</span>
</div>
<div class="relative">
<label class="font-label-lg text-label-lg text-primary block mb-1" for="plan-name">Nome do Plano de Tratamento</label>
<input class="w-full h-[48px] px-4 font-body-lg text-body-lg text-on-surface bg-surface-container-lowest border border-outline-variant rounded-lg focus:ring-1 focus:ring-primary focus:border-primary outline-none transition-all shadow-[0px_4px_12px_rgba(0,0,0,0.02)]" id="plan-name" type="text" value="Reabilitação de LCA - Fase Inicial">
</div>
</div>
<!-- Objectives Bento Style -->
<section class="bg-surface-container-lowest p-inset-card rounded-[1.25rem] shadow-[0px_4px_12px_rgba(0,0,0,0.06)] mb-stack-lg border border-surface-variant">
<div class="flex items-center justify-between mb-stack-md">
<h2 class="font-subtitle-lg text-subtitle-lg text-on-primary-fixed">Objetivos Terapêuticos</h2>
<div class="w-8 h-8 rounded-full bg-secondary-container/30 flex items-center justify-center text-secondary">
<span class="material-symbols-outlined text-base" data-icon="flag">flag</span>
</div>
</div>
<div class="space-y-3">
<!-- Editable Objective Item -->
<div class="flex items-start gap-3 group">
<div class="mt-2 w-2 h-2 rounded-full bg-primary shrink-0"></div>
<div class="flex-1">
<textarea class="w-full bg-transparent border-b border-transparent hover:border-outline-variant focus:border-primary outline-none font-body-md text-body-md text-on-surface resize-none py-1 transition-colors" rows="1">Redução do edema articular no joelho direito.</textarea>
</div>
<button aria-label="Remover" class="text-outline hover:text-error transition-colors mt-1">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Editable Objective Item -->
<div class="flex items-start gap-3 group">
<div class="mt-2 w-2 h-2 rounded-full bg-primary shrink-0"></div>
<div class="flex-1">
<textarea class="w-full bg-transparent border-b border-transparent hover:border-outline-variant focus:border-primary outline-none font-body-md text-body-md text-on-surface resize-none py-1 transition-colors" rows="1">Ganho de amplitude de movimento (ADM) até 90 graus em flexão.</textarea>
</div>
<button aria-label="Remover" class="text-outline hover:text-error transition-colors mt-1">
<span class="material-symbols-outlined text-[20px]" data-icon="close">close</span>
</button>
</div>
<!-- Add Button -->
<button class="mt-2 flex items-center gap-2 text-primary font-label-lg text-label-lg hover:text-on-primary-container transition-colors py-2">
<span class="material-symbols-outlined text-[18px]" data-icon="add_circle"><br></span></button>
</div>
</section>
<!-- Exercises Section -->

<div class="flex items-center justify-between mb-stack-md">

<button class="h-10 px-4 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg flex items-center gap-2 shadow-sm active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]" data-icon="add">add</span>
                    Novo
                </button>
</div>
<div class="space-y-4">
<!-- Exercise Card 1 -->
<div class="bg-surface-container-lowest p-inset-card rounded-[1.25rem] shadow-[0px_4px_12px_rgba(0,0,0,0.06)] border border-surface-variant flex flex-col md:flex-row gap-4 relative overflow-hidden">

<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary opacity-80"></div>
<div class="flex gap-4">
<div class="w-[88px] h-[88px] rounded-xl overflow-hidden shrink-0 bg-surface-container-high border border-outline-variant/30">
<img alt="Exercise thumbnail" class="w-full h-full object-cover" data-alt="A professional medical illustration showing a patient performing an isometric knee extension exercise. The patient is sitting on an examination table with a light lavender accent pad. The background is a clean, bright, modern physiotherapy clinic with soft natural lighting coming from a window. The overall aesthetic is clinical yet calming, adhering to a light-mode color palette with subtle purples and whites." src="assets/img/knee_extension_exercise.png">
</div>
<div class="flex-1 flex flex-col justify-center">
<h3 class="font-subtitle-md text-subtitle-md text-on-surface mb-1">Extensão Isométrica</h3>
<p class="font-body-md text-body-md text-on-surface-variant line-clamp-1">Focar na contração do vasto medial.</p>
</div>
</div>

</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-outline mb-1">Repetições</label>

</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-outline mb-1">Pausa</label>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-1 px-2 font-body-md text-body-md text-center text-on-surface focus:ring-1 focus:ring-primary shadow-sm h-8" type="text" value="30s">
</div>
</div>
<!-- Obs input -->
<div class="w-full md:col-span-full mt-2">
<input class="w-full bg-transparent border-b border-outline-variant/50 focus:border-primary outline-none font-body-md text-body-md text-on-surface py-1 text-sm placeholder:text-outline-variant/80" placeholder="Observações adicionais..." type="text">
</div>
</div>
<!-- Exercise Card 2 (No Image to show variance) -->
<div class="bg-surface-container-lowest p-inset-card rounded-[1.25rem] shadow-[0px_4px_12px_rgba(0,0,0,0.06)] border border-surface-variant flex flex-col gap-4 relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary opacity-80"></div>
<div class="flex justify-between items-start">
<div class="flex-1">
<h3 class="font-subtitle-md text-subtitle-md text-on-surface mb-1">Elevação de Perna Reta (SLR)</h3>

</div>

<span class="material-symbols-outlined" data-icon="delete_outline">delete_outline</span>
</button>
</div>
<!-- Settings Row -->
<div class="bg-surface-container p-3 rounded-xl grid grid-cols-3 gap-2">
<div class="flex flex-col">
<label class="font-label-md text-label-md text-outline mb-1">Séries</label>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-1 px-2 font-body-md text-body-md text-center text-on-surface focus:ring-1 focus:ring-primary shadow-sm h-8" type="number" value="3">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-outline mb-1">Repetições</label>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-1 px-2 font-body-md text-body-md text-center text-on-surface focus:ring-1 focus:ring-primary shadow-sm h-8" type="text" value="15">
</div>
<div class="flex flex-col">
<label class="font-label-md text-label-md text-outline mb-1">Pausa</label>
<input class="w-full bg-surface-container-lowest border-none rounded-md py-1 px-2 font-body-md text-body-md text-center text-on-surface focus:ring-1 focus:ring-primary shadow-sm h-8" type="text" value="45s">
</div>
</div>
</div>
</div>

<button class="pointer-events-auto w-full max-w-sm h-[52px] bg-primary text-on-primary rounded-2xl font-label-lg text-label-lg flex items-center justify-center gap-2 shadow-[0px_8px_16px_rgba(112,81,141,0.25)] hover:bg-on-primary-fixed-variant transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="publish">publish</span>
            Salvar e Publicar
        </button>
</div>

<nav class="md:hidden h-[72px] fixed bottom-0 w-full z-50 bg-surface shadow-[0px_-2px_10px_rgba(0,0,0,0.05)] flex justify-around items-center px-4 pb-safe">

<a class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/30 active:scale-95 transition-transform rounded-xl px-2 py-1" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="home">home</span>
<span class="font-label-md text-[10px] text-center">Início</span>
</a>

<a class="flex flex-col items-center justify-center text-secondary hover:bg-secondary-container/30 active:scale-95 transition-transform rounded-xl px-2 py-1" href="#">
<span class="material-symbols-outlined text-[24px] mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-label-md text-[10px] text-center">Atendimento</span>
</a>

<span class="font-label-md text-[10px] font-bold text-center">Paciente</span>
</a>

<span class="material-symbols-outlined text-[24px] mb-1" data-icon="person">person</span>
<span class="font-label-md text-[10px] text-center">Perfil</span>
</a>
</nav>
