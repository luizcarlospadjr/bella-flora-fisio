<script>
    document.addEventListener('DOMContentLoaded', () => {
        const addBtn = document.getElementById('add-exercise-btn');
        const list = document.getElementById('exercise-list');

        function setupDeleteButtons() {
            document.querySelectorAll('.delete-exercise').forEach(btn => {
                btn.onclick = (e) => {
                    const card = e.target.closest('.bg-surface-container-lowest');
                    if (card) card.remove();
                };
            });
        }

        if (addBtn && list) {
            addBtn.addEventListener('click', () => {
                const newCard = document.createElement('div');
                newCard.className = 'bg-surface-container-lowest p-inset-card rounded-xl shadow-[0px_4px_12px_rgba(0,0,0,0.04)] border border-outline-variant/20 transition-all duration-300';
                newCard.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <input type="text" placeholder="Nome do Exercício" class="font-subtitle-lg text-subtitle-lg text-on-surface bg-transparent border-none p-0 focus:ring-0 w-full" />
                        <button class="text-on-surface-variant hover:text-error transition-colors p-1 -mr-1 -mt-1 active:scale-95 delete-exercise">
                            <span class="material-symbols-outlined" data-icon="delete">delete</span>
                        </button>
                    </div>

                        <label class="font-label-lg text-label-lg text-on-surface">Média de Demonstração</label>
                        <div class="flex gap-3 overflow-x-auto pb-1 hide-scrollbar">

                                <span class="material-symbols-outlined text-[24px]" data-icon="add_photo_alternate">add_photo_alternate</span>
                                <span class="text-[10px] font-label-md text-center leading-tight">Anexar<br>Mídia</span>
                            </button>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <div class="flex flex-col gap-1">
                            <label class="font-label-lg text-label-lg text-on-surface">Séries</label>
                            <input class="h-[48px] px-3 rounded-lg border border-outline-variant/60 bg-transparent text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-center" type="number" placeholder="Ex: 3">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-label-lg text-label-lg text-on-surface">Repetições</label>
                            <input class="h-[48px] px-3 rounded-lg border border-outline-variant/60 bg-transparent text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-center" type="number" placeholder="Ex: 10">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-label-lg text-label-lg text-on-surface">Pausa</label>
                            <input class="h-[48px] px-3 rounded-lg border border-outline-variant/60 bg-transparent text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-center" type="text" placeholder="30s">
                        </div>
                        <div class="flex flex-col gap-1">
                            <label class="font-label-lg text-label-lg text-on-surface">Frequência</label>
                            <input class="h-[48px] px-3 rounded-lg border border-outline-variant/60 bg-transparent text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow text-center" type="text" placeholder="Ex: 3 vezes/dia">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="font-label-lg text-label-lg text-on-surface">Observações</label>
                        <textarea class="w-full px-3 py-3 rounded-lg border border-outline-variant/60 bg-transparent text-on-surface font-body-md placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow resize-none" placeholder="Adicionar notas..." rows="2"></textarea>
                    </div>
                `;

                list.prepend(newCard);
                setupDeleteButtons();
                newCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            });
        }
        setupDeleteButtons();
    });
</script>
