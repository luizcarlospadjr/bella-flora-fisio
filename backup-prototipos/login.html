<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com" rel="preconnect">

        }
    </style>

                extend: {
                    "colors": {

                        "on-secondary": "#ffffff",
                        "inverse-primary": "#dcb8fc",
                        "primary": "#70518d",
                        "surface-tint": "#70518d",
                        "primary-fixed": "#f0dbff",
                        "on-tertiary-fixed-variant": "#494900",
                        "on-background": "#1d1b1f",
                        "error-container": "#ffdad6",
                        "surface-container-low": "#f9f1f7",
                        "outline-variant": "#cdc3cf",

                    "spacing": {
                        "stack-sm": "8px",
                        "stack-lg": "24px",
                        "inset-card": "16px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "base": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Manrope"],
                        "label-lg": ["Manrope"],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  
    <!-- Firebase CDN SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <!-- Bella Flora Custom Modules -->
    <script src="navigation.js" defer></script>
    <script src="sync.js" defer></script>

<body class="bg-surface text-on-surface antialiased min-h-screen">
<main class="relative h-[884px] w-full max-w-md mx-auto overflow-hidden">
<!-- Logo Section (15% height) -->
<div class="absolute top-[15%] left-0 right-0 flex flex-col items-center justify-center">
<div class="h-12 w-12 rounded-full bg-primary-container/30 flex items-center justify-center mb-3">
<span class="material-symbols-outlined text-[28px] text-primary" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<h1 class="font-title-md text-title-md text-primary tracking-tight">Bella Flora Fisio</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">Bem-vindo de volta</p>
</div>
<!-- Inputs Section (30% height) -->
<div class="absolute top-[35%] left-margin-mobile right-margin-mobile flex flex-col gap-stack-lg">
<div class="w-full">
<label class="font-label-lg text-label-lg text-on-surface mb-base block pl-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="h-[48px] w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-4 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all placeholder:text-outline-variant shadow-sm" id="email" placeholder="seu@email.com" type="email">
</div>
</div>
<div class="w-full">
<label class="font-label-lg text-label-lg text-on-surface mb-base block pl-1" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="h-[48px] w-full bg-surface-container-lowest border border-outline-variant rounded-lg pl-12 pr-12 font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all placeholder:text-outline-variant shadow-sm" id="password" placeholder="••••••••" type="password">
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-label-md text-label-md text-primary hover:text-on-primary-container transition-colors" href="#">Esqueceu a senha?</a>
</div>
</div>
</div>
<!-- Button Section (65% height) -->
<div class="absolute top-[65%] left-margin-mobile right-margin-mobile">
<button class="h-[52px] w-full bg-primary-container text-on-primary-container font-subtitle-md text-subtitle-md rounded-[16px] flex items-center justify-center shadow-[0px_4px_12px_rgba(0,0,0,0.08)] active:scale-[0.98] transition-all hover:bg-primary hover:text-on-primary">
                Entrar
            </button>
<div class="mt-stack-lg flex flex-col items-center gap-4">
<div class="w-full flex items-center gap-4">
<div class="h-px bg-outline-variant/50 flex-1"></div>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">ou</span>
<div class="h-px bg-outline-variant/50 flex-1"></div>
</div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Ainda não tem conta? <a class="font-label-lg text-label-lg text-primary hover:underline ml-1" href="#">Criar conta</a>
</p>
</div>
</div>
</main>
</body></html>
