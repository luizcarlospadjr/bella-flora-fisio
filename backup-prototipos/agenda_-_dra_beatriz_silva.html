<script>
        function selectTime(element) {
            // Remove selection from all
            document.querySelectorAll('.time-slot').forEach(slot => {
                slot.classList.remove('border-2', 'border-primary', 'bg-primary-container', 'text-on-primary-container', 'font-bold');
                slot.classList.add('border', 'border-outline-variant', 'font-body-md', 'text-body-md', 'text-on-surface');
            });
            
            // Add selection to clicked
            element.classList.remove('border', 'border-outline-variant', 'font-body-md', 'text-body-md', 'text-on-surface');
            element.classList.add('border-2', 'border-primary', 'bg-primary-container', 'text-on-primary-container', 'font-bold');
            
            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        // Add a simple entrance animation for calendar days
        document.querySelectorAll('.calendar-grid button').forEach((btn, index) => {
            btn.style.opacity = '0';
            btn.style.transform = 'translateY(10px)';
            setTimeout(() => {
                btn.style.transition = 'all 0.4s ease-out';
                btn.style.opacity = '1';
                btn.style.transform = 'translateY(0)';
            }, index * 20);
        });
    </script>
